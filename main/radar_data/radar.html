<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raga Radar - ADS-B</title>
    <style>
        body { background: #010a01; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; touch-action: none; }
        
        /* Main UI Panel */
        #ui { 
            position: absolute; top: 15px; left: 15px; background: rgba(0, 20, 0, 0.9); 
            border: 1px solid #00ff41; padding: 10px; font-size: 13px; z-index: 100; line-height: 1.5;
            min-width: 270px; transition: all 0.2s;
        }
        
        #ui-header {
            font-weight: bold; border-bottom: 1px solid #00ff41; padding-bottom: 5px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }

        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        
        input[type="number"], select { 
            background: #000; border: 1px solid #00ff41; color: #00ff41; 
            font-family: 'Courier New', monospace; font-size: 12px; padding: 2px 5px; box-sizing: border-box;
        }
        input[type="number"] { width: 65px; }
        
        #status { font-size: 11px; color: #00aa33; margin-top: 5px; }
        #user-location { font-size: 11px; color: #008822; border-top: 1px dashed #004400; padding-top: 5px; margin-top: 5px; }

        /* HUD wrapper: transparent on desktop, so panels keep their corner positions */
        #hud-stack { display: contents; }

        /* Settings panel (positioning lives here, not inline, so mobile can override it) */
        #settings-panel {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0, 20, 0, 0.9); border: 1px solid #00ff41;
            padding: 10px; font-size: 13px; z-index: 100; min-width: 250px;
        }
        #settings-content { display: none; padding-top: 10px; }
        
        canvas { display: block; filter: brightness(1.2); }
        
        /* Tooltip Styling */
        #tooltip {
            position: absolute; background: rgba(0, 20, 0, 0.95); border: 1px solid #00ff41;
            color: #00ff41; padding: 10px; font-size: 12px; font-family: 'Courier New', monospace;
            pointer-events: none; display: none; z-index: 200;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3); text-shadow: 0 0 3px #00ff41; white-space: nowrap;
        }

        .close-btn {
            position: absolute; top: 5px; right: 10px; font-size: 16px; font-weight: bold;
            color: #00ff41; cursor: pointer; pointer-events: auto; padding: 5px;
        }

        /* Toggle Switch Styling */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: #003300; border: 1px solid #00ff41; transition: .2s; 
        }
        .slider:before { 
            position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; 
            background-color: #00aa33; transition: .2s; 
        }
        input:checked + .slider { background-color: #005511; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #00ff41; }

        @media (max-width: 768px), (max-height: 520px) {
            /* Stack the HUD panels vertically; they can never overlap. */
            #hud-stack {
                position: fixed; top: 0; left: 0; right: 0;
                display: flex; flex-direction: column; gap: 8px;
                padding: 10px;
                max-height: 100vh; max-height: 100dvh;
                overflow-y: auto; touch-action: pan-y; z-index: 100;
            }
            #hud-stack > * {
                position: static; top: auto; left: auto; right: auto;
                width: 100%; max-width: none; min-width: 0; margin: 0;
                box-sizing: border-box;
            }
            #ui-content { max-height: 40vh; max-height: 40dvh; overflow-y: auto; touch-action: pan-y; }
            #settings-content { max-height: 50vh; max-height: 50dvh; overflow-y: auto; touch-action: pan-y; }
            input[type="number"], select { height: 28px; font-size: 14px; } 
            #tooltip.mobile-active {
                top: auto !important; bottom: 20px !important; left: 50% !important;
                transform: translateX(-50%) !important; width: 85% !important; white-space: normal;
                padding-right: 30px; 
            }
        }
    </style>
</head>
<body>

<div id="hud-stack">
<div id="ui">
    <div id="ui-header" onclick="toggleMenu()">
        <span>Raga Radar - Pune</span>
        <span id="toggleBtn">[-]</span>
    </div>
    <div id="ui-content">
        <div class="control-row"><span>Range (NM):</span> <input type="number" id="range" value="100"></div>
        <div class="control-row"><span>Sweep (Sec):</span> <input type="number" id="sweep" value="30"></div>
        <div class="control-row">
            <span>Alt Filter (FT):</span> 
            <div style="display:flex; gap:5px;">
                <input type="number" id="minAlt" value="0" title="Min Altitude">
                <input type="number" id="maxAlt" value="60000" title="Max Altitude">
            </div>
        </div>
        <div class="control-row"><span>Route Format:</span> 
            <select id="routeFormat">
                <option value="short">Short</option>
                <option value="detailed">Detailed</option>
            </select>
        </div>
        <div class="control-row"><span>Route Code:</span> 
            <select id="codeType">
                <option value="icao">ICAO</option>
                <option value="iata">IATA</option>
            </select>
        </div>
        <div class="control-row">
            <span>Show Trails:</span>
            <label class="switch">
                <input type="checkbox" id="showTrails" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <div id="status">Waiting for sweep...</div>
    <div id="user-location">User GPS: Fetching...</div>
</div>

<!-- Settings Panel -->
<div id="settings-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer;" onclick="toggleSettingsPanel()">
        <strong>Settings</strong>
        <span id="settingsToggleBtn">[+]</span>
    </div>
    <div id="settings-content">
        <div class="control-row"><span>Gain (tenth dB):</span> <input type="number" id="setGain" value="496" min="0" max="496"></div>
        <div class="control-row"><span>DC Filter:</span>
            <label class="switch">
                <input type="checkbox" id="setDcFilter">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row"><span>Adaptive Gain:</span>
            <label class="switch">
                <input type="checkbox" id="setAdaptiveGain">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row"><span>Gain Mode:</span>
            <select id="setGainMode" style="background: #000; border: 1px solid #00ff41; color: #00ff41; font-family: Courier New, monospace; font-size: 12px; padding: 2px 5px; box-sizing: border-box;">
                <option value="0" style="background: #000; color: #0f0;">Manual</option>
                <option value="1" style="background: #000; color: #0f0;">Adaptive</option>
            </select>
        </div>
        <div class="control-row"><span>Aggressive:</span>
            <label class="switch">
                <input type="checkbox" id="setAggressive">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row"><span>CRC Fix:</span>
            <label class="switch">
                <input type="checkbox" id="setCrcFix">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row"><span>Sample Rate (SPS):</span>
            <select id="setSampleRate">
                <option value="2048000">2048000 (2.048 MSPS)</option>
                <option value="2400000">2400000 (2.4 MSPS)</option>
            </select>
        </div>
        <div style="border-top: 1px dashed #004400; margin: 10px 0 8px; padding-top: 8px;">Receiver Location</div>
        <div class="control-row"><span>Latitude:</span> <input type="number" id="setLat" step="0.000001" value="18.480718" style="width: 100px;"></div>
        <div class="control-row"><span>Longitude:</span> <input type="number" id="setLon" step="0.000001" value="73.898235" style="width: 100px;"></div>
        <div class="control-row" style="margin-top: 8px;">
            <button id="btnUseBrowserLoc" style="width: 100%; background: #003300; border: 1px solid #00ff41; color: #00ff41; font-family: Courier New, monospace; padding: 8px; cursor: pointer;">Use Browser Location</button>
        </div>
        <div class="control-row" style="margin-top: 8px;">
            <button id="btnApplyLocation" style="width: 100%; background: #003300; border: 1px solid #00ff41; color: #00ff41; font-family: Courier New, monospace; padding: 8px; cursor: pointer;">Apply Location</button>
        </div>
        <div id="loc-status" style="font-size: 11px; color: #00aa33; min-height: 14px; text-align: center;"></div>
        <div class="control-row" style="margin-top: 10px;">
            <button id="btnResetSettings" style="width: 100%; background: #003300; border: 1px solid #00ff41; color: #00ff41; font-family: Courier New, monospace; padding: 8px; cursor: pointer;">Reset to Defaults</button>
        </div>
        <div class="control-row" style="margin-top: 10px;">
            <button id="btnSaveSettings" style="width: 100%; background: #003300; border: 1px solid #00ff41; color: #00ff41; font-family: Courier New, monospace; padding: 8px; cursor: pointer;">Save Settings</button>
        </div>
    </div>
</div>
</div><!-- /#hud-stack -->

<div id="tooltip"></div>
<canvas id="radarCanvas"></canvas>

<script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const userLocDiv = document.getElementById('user-location');
    const JSON_URL = '/data/aircraft.json'; 
    const tooltip = document.getElementById('tooltip');
    const trailsToggle = document.getElementById('showTrails');
    
    let menuOpen = window.innerWidth > 768; 
    const uiContent = document.getElementById('ui-content');
    const toggleBtn = document.getElementById('toggleBtn');
    
    function applyMenuState() {
        const disp = menuOpen ? 'block' : 'none';
        uiContent.style.display = disp;
        statusDiv.style.display = disp;
        userLocDiv.style.display = disp;
        toggleBtn.innerText = menuOpen ? '[-]' : '[+]';
    }
    applyMenuState();

    function toggleMenu() {
        menuOpen = !menuOpen;
        applyMenuState();
    }

    window.closeTarget = function() {
        lockedTargetHex = null;
        tooltip.style.display = 'none';
    };

    let cursorX = -100, cursorY = -100;
    let lockedTargetHex = null; 
    
    let latestApiData = [];      
    let radarTargets = new Map(); 
    let routeMemory = {}; 
    let trailsMemory = new Map(); 

    // --- RADAR CENTER (from firmware /api/status) ---
    let receiverLat = 18.480718;   // fallback: Pune
    let receiverLon = 73.898235;

    async function loadReceiver() {
        try {
            const r = await fetch('/api/status');
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const s = await r.json();
            if (s && s.receiver && typeof s.receiver.lat === 'number') {
                receiverLat = s.receiver.lat;
                receiverLon = s.receiver.lon;
            }
            if (s && s.phase) {
                const phase = document.getElementById('recvPhase');
                if (phase) phase.innerText = `RX: ${s.phase}`;
            }
        } catch (err) {
            // keep fallback center; the page still works offline
        }
    }

    let userLat = null, userLon = null;
    let scanAngle = -Math.PI / 2; 
    let lastAngle = scanAngle;

    canvas.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse') {
            const rect = canvas.getBoundingClientRect();
            cursorX = e.clientX - rect.left;
            cursorY = e.clientY - rect.top;
        }
    });

    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const tapX = e.clientX - rect.left;
        const tapY = e.clientY - rect.top;
        
        let hitFound = false;
        radarTargets.forEach((target, hex) => {
            const dx = tapX - target.displayX;
            const dy = tapY - target.displayY;
            if (dx * dx + dy * dy < 400) { 
                lockedTargetHex = hex;
                hitFound = true;
            }
        });
        if (!hitFound) lockedTargetHex = null; 
    });

    canvas.addEventListener('pointerout', (e) => {
        if (e.pointerType === 'mouse') { cursorX = -100; cursorY = -100; }
    });

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    navigator.geolocation.getCurrentPosition((pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        userLocDiv.innerText = `User GPS: ${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
    }, (err) => {
        userLocDiv.innerText = `User GPS: Unavailable`;
    });

    // Route lookup: adsbdb is a GET API and sends "Access-Control-Allow-Origin: *",
    // so it works from the device's browser. (adsb.lol /api/0/routeset does NOT send
    // CORS headers, so a browser POST is blocked with "Failed to fetch".)
    const ROUTE_API = 'https://api.adsbdb.com/v0/callsign/';
    const routeInflight = new Set();

    async function fetchRouteForCallsign(callsign) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 8000);
        try {
            const r = await fetch(ROUTE_API + encodeURIComponent(callsign), { signal: ctrl.signal });
            if (!r.ok) {
                routeMemory[callsign] = { not_found: true };
                return;
            }
            const data = await r.json();
            const fr = data && data.response && data.response.flightroute;
            if (!fr || !fr.origin || !fr.destination) {
                routeMemory[callsign] = { not_found: true };
                return;
            }
            const o = fr.origin, d = fr.destination;
            routeMemory[callsign] = {
                airport_codes: `${o.icao_code || '???'}-${d.icao_code || '???'}`,
                _airport_codes_iata: `${o.iata_code || '???'}-${d.iata_code || '???'}`,
                _airports: [
                    { name: o.name || o.municipality || 'Unknown', location: o.municipality || o.country_name || 'Unknown' },
                    { name: d.name || d.municipality || 'Unknown', location: d.municipality || d.country_name || 'Unknown' }
                ]
            };
        } catch (error) {
            // network/CORS/abort: drop the pending marker so it can retry on a later sweep
            if (routeMemory[callsign] && routeMemory[callsign].pending) delete routeMemory[callsign];
        } finally {
            clearTimeout(timer);
            routeInflight.delete(callsign);
        }
    }

    function syncRoutesToMemory(currentAircraft) {
        const activeCallsigns = new Set();

        currentAircraft.forEach(ac => {
            if (ac.flight) {
                const callsign = ac.flight.trim();
                if (callsign) {
                    activeCallsigns.add(callsign);
                    if (!routeMemory[callsign] && !routeInflight.has(callsign)) {
                        routeMemory[callsign] = { pending: true };
                        routeInflight.add(callsign);
                        fetchRouteForCallsign(callsign);
                    }
                }
            }
        });

        Object.keys(routeMemory).forEach(callsign => {
            if (!activeCallsigns.has(callsign)) delete routeMemory[callsign];
        });
    }

    async function fetchAircraftData() {
        try {
            const response = await fetch(`${JSON_URL}?t=${Date.now()}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            latestApiData = data.aircraft || []; 
            
            syncRoutesToMemory(latestApiData);
            const activeCacheCount = Object.keys(routeMemory).length;
            statusDiv.innerHTML = `SYNCED | ACFT: ${latestApiData.length} | CACHED RTE: ${activeCacheCount}<br>RADAR REF: ${receiverLat.toFixed(4)}, ${receiverLon.toFixed(4)}`;
        } catch (err) {
            statusDiv.innerHTML = `<span style="color:red">SYNC ERR: ${err.message}</span>`;
        }
    }

    function gpsToXY(lat, lon, rangeNM, screenRadius) {
        const dy = (lat - receiverLat) * 60;
        const dx = (lon - receiverLon) * 60 * Math.cos(receiverLat * Math.PI / 180);
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        return { 
            x: centerX + (dx / rangeNM) * screenRadius, 
            y: centerY - (dy / rangeNM) * screenRadius, 
            dist: Math.sqrt(dx*dx + dy*dy) 
        };
    }

    function render() {
        ctx.fillStyle = "rgba(0, 12, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const screenRadius = Math.min(centerX, centerY) * 0.85;
        const cfgRange = parseFloat(document.getElementById('range').value) || 100;
        const cfgSweep = parseFloat(document.getElementById('sweep').value) || 30;
        const routeFormat = document.getElementById('routeFormat').value;
        const codeType = document.getElementById('codeType').value;
        const showTrails = trailsToggle.checked;
        
        const minAlt = parseFloat(document.getElementById('minAlt').value) || 0;
        const maxAlt = parseFloat(document.getElementById('maxAlt').value) || 60000;

        lastAngle = scanAngle;
        scanAngle += (Math.PI * 2) / (60 * cfgSweep);

        if (Math.floor((lastAngle + Math.PI/2) / (Math.PI*2)) < Math.floor((scanAngle + Math.PI/2) / (Math.PI*2))) {
            fetchAircraftData();
        }

        ctx.strokeStyle = "#002200";
        ctx.fillStyle = "#004400"; 
        ctx.font = "10px Courier New";
        ctx.textAlign = "center"; 
        for (let i = 1; i <= 4; i++) {
            const r = (screenRadius / 4) * i;
            const dist = (cfgRange / 4) * i;
            ctx.beginPath();
            ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillText(`${dist} NM`, centerX, centerY - r + 10);
        }
        ctx.textAlign = "left";

        ctx.strokeStyle = "#00ff41";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(scanAngle) * screenRadius, centerY + Math.sin(scanAngle) * screenRadius);
        ctx.stroke();

        let displayAircraft = null;

        const currentScan = (scanAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        const prevScan = (lastAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

        const filteredApiData = latestApiData.filter(ac => {
            const alt = ac.alt_baro || 0;
            return alt >= minAlt && alt <= maxAlt;
        });

        filteredApiData.forEach(ac => {
            if (!ac.lat || !ac.lon) return;
            const pos = gpsToXY(ac.lat, ac.lon, cfgRange, screenRadius);
            if (pos.dist > cfgRange) return;

            let targetAngle = Math.atan2(pos.y - centerY, pos.x - centerX);
            targetAngle = (targetAngle + Math.PI * 2) % (Math.PI * 2);

            let crossed = false;
            if (prevScan < currentScan) {
                if (targetAngle >= prevScan && targetAngle <= currentScan) crossed = true;
            } else {
                if (targetAngle >= prevScan || targetAngle <= currentScan) crossed = true;
            }

            if (crossed) {
                let trend = "=";
                if (ac.baro_rate !== undefined) {
                    if (ac.baro_rate > 64) trend = "↑";
                    else if (ac.baro_rate < -64) trend = "↓";
                } else if (radarTargets.has(ac.hex)) {
                    const oldTarget = radarTargets.get(ac.hex);
                    if (ac.alt_baro > oldTarget.alt_baro + 50) trend = "↑";
                    else if (ac.alt_baro < oldTarget.alt_baro - 50) trend = "↓";
                    else trend = oldTarget.trend || "=";
                }

                if (radarTargets.has(ac.hex)) {
                    const oldTarget = radarTargets.get(ac.hex);
                    if (oldTarget.lat !== ac.lat || oldTarget.lon !== ac.lon) {
                        let trail = trailsMemory.get(ac.hex) || [];
                        trail.push({ lat: oldTarget.lat, lon: oldTarget.lon });
                        if (trail.length > 7) trail.shift();
                        trailsMemory.set(ac.hex, trail);
                    }
                }
                radarTargets.set(ac.hex, { ...ac, displayX: pos.x, displayY: pos.y, alpha: 1.0, trend: trend });
            }
        });

        radarTargets.forEach((target, hex) => {
            const isEmergency = ['7700', '7600', '7500'].includes(target.squawk);
            
            if (showTrails && trailsMemory.has(hex)) {
                const trail = trailsMemory.get(hex);
                trail.forEach((point, index) => {
                    const trailPos = gpsToXY(point.lat, point.lon, cfgRange, screenRadius);
                    if (trailPos.dist <= cfgRange) {
                        const dotAlpha = 0.2 + (index / trail.length) * 0.5;
                        ctx.fillStyle = isEmergency ? `rgba(255, 0, 0, ${dotAlpha})` : `rgba(0, 255, 65, ${dotAlpha})`;
                        ctx.beginPath();
                        ctx.arc(trailPos.x, trailPos.y, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }

            target.alpha = Math.max(0.35, target.alpha - (1 / (60 * cfgSweep)));
            
            ctx.globalAlpha = target.alpha;
            ctx.fillStyle = isEmergency ? "#ff0000" : "#00ff41";
            ctx.strokeStyle = ctx.fillStyle;
            
            if (lockedTargetHex === hex) {
                ctx.beginPath();
                ctx.arc(target.displayX, target.displayY, 8, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(target.displayX, target.displayY, 3, 0, Math.PI * 2);
            ctx.fill();

            const callsign = target.flight ? target.flight.trim() : target.hex.toUpperCase();
            const altRaw = target.alt_baro !== undefined ? target.alt_baro : 0;
            let altFL = altRaw <= 0 ? "GND" : Math.floor(altRaw / 100).toString().padStart(3, '0');
            const speed = target.gs ? Math.round(target.gs).toString() : "---";
            const trend = target.trend || "=";

            ctx.beginPath();
            ctx.moveTo(target.displayX + 3, target.displayY - 3);
            ctx.lineTo(target.displayX + 7, target.displayY - 7);
            ctx.stroke();

            ctx.font = "10px Courier New";
            ctx.fillText(callsign, target.displayX + 8, target.displayY - 6);
            ctx.fillText(`${altFL}${trend} ${speed}`, target.displayX + 8, target.displayY + 6);
            
            ctx.globalAlpha = 1.0; 

            const dx = cursorX - target.displayX;
            const dy = cursorY - target.displayY;
            if (dx * dx + dy * dy < 150) displayAircraft = target;
            if (lockedTargetHex === hex) displayAircraft = target;
        });

        const currentHexes = new Set(filteredApiData.map(a => a.hex));
        radarTargets.forEach((_, hex) => {
            if (!currentHexes.has(hex)) {
                radarTargets.delete(hex);
                trailsMemory.delete(hex);
            }
        });

        // --- TOOLTIP UI UPDATES ---
        if (displayAircraft) {
            const isMobile = window.innerWidth <= 768;
            tooltip.style.display = 'block';
            
            let closeButtonHTML = '';

            if (isMobile && lockedTargetHex) {
                tooltip.classList.add('mobile-active');
                closeButtonHTML = `<div class="close-btn" onclick="closeTarget()">✖</div>`;
            } else {
                tooltip.classList.remove('mobile-active');
                tooltip.style.left = (displayAircraft.displayX + 15) + 'px'; 
                tooltip.style.top = (displayAircraft.displayY + 15) + 'px';
            }
            
            const callsign = displayAircraft.flight ? displayAircraft.flight.trim() : 'UNKNOWN';
            let routeDisplay = "NO ROUTE DATA";
            
            if (callsign !== 'UNKNOWN' && routeMemory[callsign]) {
                const memInfo = routeMemory[callsign];
                if (memInfo.pending) routeDisplay = "FETCHING...";
                else if (memInfo.not_found) routeDisplay = "NOT IN DB";
                else {
                    let shortCode = codeType === 'icao' ? (memInfo.airport_codes || 'N/A') : (memInfo._airport_codes_iata || 'N/A');
                    if (routeFormat === 'short') {
                        routeDisplay = shortCode;
                    } else {
                        if (memInfo._airports && memInfo._airports.length >= 2) {
                            const src = memInfo._airports[0];
                            const dst = memInfo._airports[memInfo._airports.length - 1];
                            routeDisplay = `${shortCode}<br>
                                FROM: ${src.name || 'Unknown'} (${src.location || 'Unknown'})<br>
                                TO&nbsp;&nbsp;: ${dst.name || 'Unknown'} (${dst.location || 'Unknown'})`;
                        } else {
                            routeDisplay = `${shortCode} (PARTIAL DATA)`;
                        }
                    }
                }
            }

            tooltip.innerHTML = `
                ${closeButtonHTML}
                <strong style="border-bottom: 1px solid #00ff41; display:block; margin-bottom:4px; padding-right: 20px;">TARGET ACQUIRED ${lockedTargetHex === displayAircraft.hex ? '[LOCKED]' : ''}</strong>
                FLT: ${callsign}<br>
                RTE: ${routeDisplay}<br>
                HEX: ${displayAircraft.hex ? displayAircraft.hex.toUpperCase() : '---'}<br>
                ALT: ${displayAircraft.alt_baro ? displayAircraft.alt_baro + ' FT' : '---'}<br>
                SPD: ${displayAircraft.gs ? displayAircraft.gs + ' KTS' : '---'}<br>
                SQK: ${displayAircraft.squawk || '----'}
            `;
        } else {
            tooltip.style.display = 'none';
        }

        requestAnimationFrame(render);
    }

    loadReceiver();
    fetchAircraftData();
    render();
</script>

<script>
    let settingsOpen = false;
    const settingsContent = document.getElementById("settings-content");
    const settingsToggleBtn = document.getElementById("settingsToggleBtn");

    const settingsForm = {
        gain: document.getElementById("setGain"),
        dcFilter: document.getElementById("setDcFilter"),
        adaptiveGain: document.getElementById("setAdaptiveGain"),
        gainMode: document.getElementById("setGainMode"),
        aggressive: document.getElementById("setAggressive"),
        crcFix: document.getElementById("setCrcFix"),
        sampleRate: document.getElementById("setSampleRate"),
        btnReset: document.getElementById("btnResetSettings"),
        btnSave: document.getElementById("btnSaveSettings")
    };

    const locationForm = {
        lat: document.getElementById("setLat"),
        lon: document.getElementById("setLon"),
        btnBrowser: document.getElementById("btnUseBrowserLoc"),
        btnApply: document.getElementById("btnApplyLocation"),
        status: document.getElementById("loc-status")
    };

    window.toggleSettingsPanel = (function() {
        let settingsOpen = false;
        return function() {
            settingsOpen = !settingsOpen;
            settingsContent.style.display = settingsOpen ? "block" : "none";
            settingsToggleBtn.innerText = settingsOpen ? "[-]" : "[+]";
            if (settingsOpen) { loadSettings(); loadLocation(); }
        };
    })();

    async function loadSettings() {
        try {
            const r = await fetch("/api/settings");
            if (!r.ok) throw new Error("HTTP " + r.status);
            const s = await r.json();
            if (settingsForm.gain) settingsForm.gain.value = s.gain;
            if (settingsForm.dcFilter) settingsForm.dcFilter.checked = s.dc_filter;
            if (settingsForm.adaptiveGain) settingsForm.adaptiveGain.checked = s.adaptive_gain;
            if (settingsForm.gainMode) {
                const gm = s.gain_mode;
                if (gm === 0 || gm === "0" || gm === "manual") {
                    settingsForm.gainMode.value = "0";
                } else if (gm === 1 || gm === "1" || gm === "adaptive") {
                    settingsForm.gainMode.value = "1";
                } else {
                    settingsForm.gainMode.value = "0";
                }
            }
            if (settingsForm.aggressive) settingsForm.aggressive.checked = s.aggressive;
            if (settingsForm.crcFix) settingsForm.crcFix.checked = s.crc_fix;
            if (settingsForm.sampleRate) settingsForm.sampleRate.value = s.sample_rate_sps;
        } catch (err) {
            console.error("Failed to load settings:", err);
        }
    }

    async function saveSettings() {
        const body = {
            gain: parseInt(settingsForm.gain.value),
            dc_filter: settingsForm.dcFilter.checked,
            adaptive_gain: settingsForm.adaptiveGain.checked,
            gain_mode: parseInt(settingsForm.gainMode.value, 10),
            aggressive: settingsForm.aggressive.checked,
            crc_fix: settingsForm.crcFix.checked,
            sample_rate_sps: parseInt(settingsForm.sampleRate.value)
        };
        try {
            const r = await fetch("/api/settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error("HTTP " + r.status);
            const s = await r.json();
            alert("Settings saved!" + (s.sample_rate_sps !== body.sample_rate_sps ? " Device will restart." : ""));
            loadSettings();
        } catch (err) {
            alert("Failed to save settings: " + err.message);
        }
    }

    async function resetSettings() {
        if (!confirm("Reset all settings to defaults?")) return;
        try {
            const r = await fetch("/api/settings/reset", { method: "POST" });
            if (!r.ok) throw new Error("HTTP " + r.status);
            alert("Settings reset to defaults");
            loadSettings();
        } catch (err) {
            alert("Failed to reset settings: " + err.message);
        }
    }

    // --- Receiver Location ---
    function setLocStatus(msg, ok) {
        if (!locationForm.status) return;
        locationForm.status.textContent = msg;
        locationForm.status.style.color = ok ? "#00aa33" : "#ff5555";
    }

    async function loadLocation() {
        try {
            const r = await fetch("/api/location");
            if (!r.ok) throw new Error("HTTP " + r.status);
            const s = await r.json();
            if (locationForm.lat && typeof s.lat === "number") locationForm.lat.value = s.lat;
            if (locationForm.lon && typeof s.lon === "number") locationForm.lon.value = s.lon;
            setLocStatus("", true);
        } catch (err) {
            console.error("Failed to load location:", err);
        }
    }

    function useBrowserLocation() {
        if (!navigator.geolocation) {
            setLocStatus("Geolocation not supported — enter lat/lon manually.", false);
            return;
        }
        setLocStatus("Requesting browser location…", true);
        navigator.geolocation.getCurrentPosition((pos) => {
            locationForm.lat.value = pos.coords.latitude.toFixed(6);
            locationForm.lon.value = pos.coords.longitude.toFixed(6);
            setLocStatus("Detected — press Apply Location.", true);
        }, (err) => {
            setLocStatus("Browser location unavailable — enter lat/lon manually.", false);
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
    }

    async function applyLocation() {
        const lat = parseFloat(locationForm.lat.value);
        const lon = parseFloat(locationForm.lon.value);
        if (!isFinite(lat) || !isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            setLocStatus("Invalid lat/lon (lat -90..90, lon -180..180).", false);
            return;
        }
        try {
            const r = await fetch("/api/location", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ lat: lat, lon: lon })
            });
            if (!r.ok) throw new Error("HTTP " + r.status);
            const s = await r.json();
            // Re-center the radar immediately with the new reference.
            receiverLat = s.lat;
            receiverLon = s.lon;
            if (typeof loadReceiver === "function") loadReceiver();
            setLocStatus("Location applied.", true);
        } catch (err) {
            setLocStatus("Failed to apply: " + err.message, false);
        }
    }

    // Event listeners (no auto-save on change)
    if (settingsForm.gain) settingsForm.gain.addEventListener("change", () => {});
    if (settingsForm.dcFilter) settingsForm.dcFilter.addEventListener("change", () => {});
    if (settingsForm.adaptiveGain) settingsForm.adaptiveGain.addEventListener("change", () => {});
    if (settingsForm.gainMode) settingsForm.gainMode.addEventListener("change", () => {});
    if (settingsForm.aggressive) settingsForm.aggressive.addEventListener("change", () => {});
    if (settingsForm.crcFix) settingsForm.crcFix.addEventListener("change", () => {});
    if (settingsForm.sampleRate) settingsForm.sampleRate.addEventListener("change", () => {});
    if (settingsForm.btnReset) settingsForm.btnReset.addEventListener("click", resetSettings);
    if (settingsForm.btnSave) settingsForm.btnSave.addEventListener("click", saveSettings);
    if (locationForm.btnBrowser) locationForm.btnBrowser.addEventListener("click", useBrowserLocation);
    if (locationForm.btnApply) locationForm.btnApply.addEventListener("click", applyLocation);

loadSettings();
loadLocation();
</script>
</body>
</html>
